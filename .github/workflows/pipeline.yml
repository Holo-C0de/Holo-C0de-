name: Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: HTML lint
        run: |
          if grep -q "<html>" index.html && grep -q "</html>" index.html; then
            echo "HTML structure is OK"
          else
            echo "HTML structure is broken!"
            exit 1
          fi

      - name: Build Docker image
        run: docker build -t test-image .

      - name: Smoke test container
        run: |
          docker run -d -p 8080:80 --name smoke-test test-image
          sleep 3
          if curl -s http://localhost:8080 | grep -q "Малахов Алексей Денисович"; then
            echo "OK"
          else
            echo "Smoke test failed: Could not find expected text"
            exit 1
          fi
          docker stop smoke-test

  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ghcr.io/${{ github.repository }}:latest .
          docker push ghcr.io/${{ github.repository }}:latest